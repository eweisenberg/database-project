{% extends "base.html" %}
{% block title %}Create Account - Health System Management{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-8 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">Patient Registration</h2>

        <form method="POST" action="{{ url_for('register') }}" novalidate>
          <h5 class="border-bottom pb-2 mb-3 text-secondary">Account Credentials</h5>
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" name="email" value="{{ form_data.email if form_data else '' }}" required>
            </div>
            <div class="col-md-6">
              <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="col-md-6">
              <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
          </div>

          <h5 class="border-bottom pb-2 mb-3 text-secondary">Personal Information</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="first_name" name="first_name" value="{{ form_data.first_name if form_data else '' }}" required>
            </div>
            <div class="col-md-6">
              <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="last_name" name="last_name" value="{{ form_data.last_name if form_data else '' }}" required>
            </div>
            <div class="col-md-6">
              <label for="phone_number" class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="e.g. 555-123-4567" value="{{ form_data.phone_number if form_data else '' }}" required>
            </div>
            <div class="col-md-3">
              <label for="dob" class="form-label">Date of Birth <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="dob" name="dob" value="{{ form_data.dob if form_data else '' }}" required>
            </div>
            <div class="col-md-3">
              <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
              <select class="form-select" id="gender" name="gender" required>
                <option value="" {% if not form_data or not form_data.gender %}selected{% endif %} disabled>Select...</option>
                <option value="Male" {% if form_data and form_data.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if form_data and form_data.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if form_data and form_data.gender == 'Other' %}selected{% endif %}>Other</option>
                <option value="Prefer not to say" {% if form_data and form_data.gender == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12">
              <label for="street_address" class="form-label">Street Address <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="street_address" name="street_address" value="{{ form_data.street_address if form_data else '' }}" required>
            </div>
            <div class="col-md-5">
              <label for="city" class="form-label">City <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="city" name="city" value="{{ form_data.city if form_data else '' }}" required>
            </div>
            <div class="col-md-3">
              <label for="state" class="form-label">State (abbr.) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="state" name="state" maxlength="2" style="text-transform: uppercase;" value="{{ form_data.state if form_data else '' }}" required>
            </div>
            <div class="col-md-4">
              <label for="zip_code" class="form-label">Zip Code <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="zip_code" name="zip_code" maxlength="10" value="{{ form_data.zip_code if form_data else '' }}" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="insurance" class="form-label">Insurance Provider</label>
              <input type="text" class="form-control" id="insurance" name="insurance" value="{{ form_data.insurance if form_data else '' }}">
            </div>
            <div class="col-md-6">
              <label for="member_id" class="form-label">Insurance Member ID</label>
              <input type="text" class="form-control" id="member_id" name="member_id" value="{{ form_data.member_id if form_data else '' }}">
            </div>
            <div class="col-12">
              <label for="emergency_contact" class="form-label">Emergency Contact Info</label>
              <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ form_data.emergency_contact if form_data else '' }}">
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Create Account</button>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Already have an account? Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
