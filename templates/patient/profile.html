{% extends "base.html" %}
{% block title %}My Profile - Health System Management{% endblock %}

{% block content %}
<div class="row justify-content-center my-3">
  <div class="col-lg-10">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">My Profile</h2>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('patient.profile') }}" novalidate>
          <div class="row g-4">
            <!-- Left Column: Personal Information & Contact -->
            <div class="col-md-6 border-end-md">
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="first_name" class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="first_name" name="first_name" value="{{ patient.first_name }}" required>
                </div>
                <div class="col-sm-6">
                  <label for="last_name" class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="last_name" name="last_name" value="{{ patient.last_name }}" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="dob" class="form-label fw-semibold">Date of Birth <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="dob" name="dob" value="{{ patient.dob_iso }}" required>
                </div>
                <div class="col-sm-6">
                  <label for="gender" class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                  <select class="form-select" id="gender" name="gender" required>
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                    <option value="Prefer not to say" {% if patient.gender == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="phone_number" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phone_number" name="phone_number" value="{{ patient.phone_number }}" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email" value="{{ patient.email }}" required>
              </div>
            </div>

            <!-- Right Column: Address, Insurance, & Emergency Contact -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="street_address" class="form-label fw-semibold">Home Address <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="street_address" name="street_address" value="{{ patient.street_address }}" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-5">
                  <label for="city" class="form-label fw-semibold">City <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="city" name="city" value="{{ patient.city or '' }}" required>
                </div>
                <div class="col-sm-3">
                  <label for="state" class="form-label fw-semibold">State <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="state" name="state" maxlength="2" style="text-transform: uppercase;" value="{{ patient.state or '' }}" required>
                </div>
                <div class="col-sm-4">
                  <label for="zip_code" class="form-label fw-semibold">Zip Code <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="zip_code" name="zip_code" maxlength="10" value="{{ patient.zip_code }}" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="insurance" class="form-label fw-semibold">Insurance Provider</label>
                  <input type="text" class="form-control" id="insurance" name="insurance" placeholder="None" value="{{ patient.insurance or '' }}">
                </div>
                <div class="col-sm-6">
                  <label for="member_id" class="form-label fw-semibold">Member ID</label>
                  <input type="text" class="form-control" id="member_id" name="member_id" placeholder="None" value="{{ patient.member_id or '' }}">
                </div>
              </div>

              <div class="mb-3">
                <label for="emergency_contact" class="form-label fw-semibold">Emergency Contact</label>
                <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" placeholder="None" value="{{ patient.emergency_contact or '' }}">
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 pt-4">
            <a href="{{ url_for('patient.profile') }}" class="btn btn-outline-secondary px-3">Discard Changes</a>
            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
